name: Database migrations

# Applies new files in supabase/migrations to the Supabase project after they reach main.
# Needs 3 repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      # Supabase CLI v3 targets the local database by default: --remote = the linked project.
      # The Phase 0 schema (files 20261115000001..14) was run by hand in the SQL Editor.
      # Record it as applied so `db push` does not run it a second time. Safe to repeat.
      - name: Mark Phase 0 migrations as applied
        run: |
          versions=$(ls supabase/migrations | grep -E '^20261115' | cut -d_ -f1 | tr '\n' ' ')
          supabase migration repair --status applied $versions --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase db push --dry-run --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
